# Render Blueprint — the API and its Redis. The two SPAs are deployed on VERCEL
# (one project per subdirectory, Root Directory = admin / user), so they are
# deliberately NOT defined here. See DEPLOY.md.
#
# Two-pass deploy: the hostnames don't exist until the services are created, and
# several env vars have to reference each other's URL. Everything marked
# `sync: false` is deliberately left blank here and filled in from the dashboard after
# the first deploy. See DEPLOY.md for the exact values.
#
# Region: singapore is the closest to India — lowest latency for candidates and for
# an Atlas cluster in ap-south-1/ap-southeast-1.

services:
  # ---------------------------------------------------------------- API + Socket.io
  - type: web
    name: recruitment-api
    runtime: node
    region: singapore
    # `starter` ($7/mo, always-on). Do NOT drop back to `free`: free spins the service
    # down after ~15 min idle, which is survivable for browsing but silently breaks three
    # things — the node-cron interview reminders (24h/1h) never fire while asleep, a
    # candidate opening a magic link waits ~50s for a cold start, and any detached
    # background job is killed mid-run (assessment item generation returns 202 and
    # finishes in the background, so a spin-down leaves a half-generated item pool that
    # then fails the section-coverage check at approve time). See DEPLOY.md.
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Pinned, not left to Render's rolling default — an unpinned runtime can change
      # under you between two deploys of the same commit. package.json `engines` states
      # the supported range; this picks a point inside it.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: RUN_WORKERS_IN_API
        # Single instance — the API runs its own cron/queue workers. Set to false only
        # when you also run a separate `npm run worker` service.
        value: "true"

      # --- secrets Render generates once and stores (never in git) ---
      # These are NOT interchangeable: AUTH_JWT_SECRET signs User/socket tokens,
      # JWT_SECRET signs interview-portal tokens. See CLAUDE.md.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SIGNUP_KEY
        generateValue: true

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: recruitment-kv
          property: connectionString

      # --- pass 2: paste after the first deploy (DEPLOY.md step 5) ---
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN_ADMIN
        sync: false
      - key: CLIENT_ORIGIN_USER
        sync: false
      # The ONE base for candidate-facing emailed links. Boot FAILS if this resolves to a
      # dev tunnel or localhost — config/env.js refuses to start rather than send links
      # that die. Set it to the recruitment-user URL, with scheme.
      - key: PUBLIC_CANDIDATE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

      # --- object storage: REQUIRED here, unlike locally ---
      # Render's filesystem is ephemeral. With these unset, storageService falls back to
      # backend/uploads and every uploaded resume is destroyed on the next deploy or
      # restart — after which ATS extracts empty text and scores a candidate on nothing.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"

      # --- email (required in production — boot fails without SMTP_HOST) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TIMEZONE
        value: Asia/Kolkata

      # --- AI (unset => deterministic fallback mode, labelled as such in the UI) ---
      - key: OPENROUTER_API_KEY
        sync: false

      # --- payments (unset => checkout 503s, UI shows "Payments Coming Soon") ---
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: METRICS_TOKEN
        generateValue: true

  # ---------------------------------------------------------------- the two SPAs
  # NOT here. recruitment-user and recruitment-admin are Vercel projects, each
  # pointed at a subdirectory of this repo, each carrying its own vercel.json with
  # the SPA rewrite React Router needs. Their VITE_API_URL is set in the Vercel
  # dashboard and is build-time — changing it requires a redeploy there, not here.

  # ---------------------------------------------------------------- MinIO (optional)
  # Uncomment ONLY if you want self-hosted object storage instead of Cloudflare R2.
  # Read DEPLOY.md § "Option B" first — the honest summary:
  #
  #   * A disk is mandatory, and Render disks require a PAID instance. MinIO on an
  #     ephemeral filesystem accepts writes, reports success and loses every object
  #     on the next deploy — worse than having no storage, because nothing errors.
  #   * Realistic cost is $7/mo (starter) + ~$0.25/GB/mo (disk). R2 is $0.
  #   * `pserv` (private service), not `web`: storageService streams every download
  #     through Express and this codebase issues NO presigned URLs, so a candidate's
  #     browser never contacts the bucket. It must not have a public hostname.
  #   * Create the bucket yourself — the official image has no auto-create.
  #
  # - type: pserv
  #   name: recruitment-minio
  #   runtime: image
  #   region: singapore
  #   plan: starter
  #   image:
  #     url: docker.io/minio/minio:latest
  #   dockerCommand: server /data --console-address :9001
  #   disk:
  #     name: minio-data
  #     mountPath: /data
  #     sizeGB: 10
  #   envVars:
  #     - key: MINIO_ROOT_USER
  #       sync: false
  #     - key: MINIO_ROOT_PASSWORD
  #       sync: false
  #
  # Then on recruitment-api, over the private network (http, not https — internal
  # traffic is not TLS terminated) and path-style (MinIO cannot do virtual-host):
  #   S3_ENDPOINT=http://recruitment-minio:9000
  #   S3_FORCE_PATH_STYLE=true
  #   S3_REGION=us-east-1

  # ---------------------------------------------------------------- Redis / Key Value
  # Backs the Socket.io adapter, the BullMQ email queue, distributed cron locks and
  # shared rate limiting. Required in production — the API refuses to boot without it.
  - type: keyvalue
    name: recruitment-kv
    region: singapore
    plan: free
    ipAllowList: []   # private network only — no public access
    # MUST be noeviction. Render defaults new instances to allkeys-lru, under which Redis
    # evicts BullMQ's own bookkeeping keys when memory tightens — jobs then disappear
    # WITHOUT emitting a `failed` event, so emailWorker's final-attempt alert never fires
    # and the EmailLog row sits at "queued" forever while the UI reports success. That is
    # registration OTPs, verification links and interview invitations silently not sent.
    maxmemoryPolicy: noeviction
