<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireFlow AI — Admin</title>
    <meta
      name="description"
      content="HireFlow AI — evidence-bound candidate screening and AI interviews. Every score is computed from cited résumé claims against a versioned, recruiter-approved rubric."
    />
    <!-- The sidebar monogram, so the tab is recognisable in a row of twenty.
         SVG rather than .ico: one file, sharp at every density, ~200 bytes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- slate-50, the page background. Not the slate-900 sidebar: this origin
         also serves the signed-out marketing pages, and mobile browser chrome
         should continue the surface a visitor actually lands on.
         No robots meta here for the same reason — a blanket noindex on this
         origin would deindex the marketing site along with the dashboard. -->
    <meta name="theme-color" content="#f8fafc" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
